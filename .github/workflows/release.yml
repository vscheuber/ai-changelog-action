name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | patch | minor | major'
        default: 'prerelease'
        required: true
      force-release:
        description: 'When true, allow a release even if there are no new commits since the last comparable release tag'
        type: boolean
        default: false
        required: false
      current-version:
        description: 'Optional current/base version override (example: 1.2.0, 1.2.0-rc.2, or v1.2.0)'
        default: ''
        required: false
      prerelease-identifier:
        description: 'Optional identifier for prereleases (example: beta, rc, alpha). Leave empty for numeric prereleases like -1, -2.'
        default: ''
        required: false
      llm-provider:
        description: 'LLM provider'
        default: 'openai'
        required: true
      model:
        description: 'LLM model'
        default: 'gpt-4o'
        required: true
      target-user-type:
        description: 'Audience type for changelog output (user or developer)'
        default: 'user'
        required: true
      user-focus:
        description: 'Optional audience override phrase (example: CLI users)'
        default: ''
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Compute next version
        id: version
        uses: vscheuber/version-bump-action@v1
        with:
          release-type: ${{ inputs.release-type }}
          current-version: ${{ inputs.current-version }}
          prerelease-identifier: ${{ inputs.prerelease-identifier }}

      - name: Show release plan
        run: |
          echo "Base version: ${{ steps.version.outputs.base }}"
          echo "Base source: ${{ steps.version.outputs.base_source }}"
          echo "Base ref: ${{ steps.version.outputs.base_ref || '(none)' }}"
          echo "Action release-type: ${{ steps.version.outputs.action_release_type }}"
          echo "Force release: ${{ inputs.force-release }}"
          echo "Next version: ${{ steps.version.outputs.normalized }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"

      - name: Abort if no new commits since last release
        id: commit_gate
        run: |
          set -euo pipefail

          force_release='${{ inputs.force-release }}'
          base_ref='${{ steps.version.outputs.base_ref }}'

          if [[ "$force_release" == "true" ]]; then
            echo "force-release=true, skipping commit-count gate"
            echo "commit_count=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$base_ref" ]]; then
            echo "No comparable base release tag found; allowing release."
            echo "commit_count=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/${base_ref}" >/dev/null; then
            echo "Base reference '${base_ref}' is not an existing tag; allowing release."
            echo "commit_count=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count="$(git rev-list --count "${base_ref}..HEAD")"
          echo "Commits since ${base_ref}: ${commit_count}"
          echo "commit_count=${commit_count}" >> "$GITHUB_OUTPUT"

          if [[ "$commit_count" -eq 0 ]]; then
            echo "No new commits since ${base_ref}. Aborting release. Set force-release=true to override."
            exit 1
          fi

      - name: Update changelog using this action
        id: changelog
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-provider: ${{ inputs.llm-provider }}
          model: ${{ inputs.model }}
          target-user-type: ${{ inputs.target-user-type }}
          user-focus: ${{ inputs.user-focus }}
          release-type: ${{ steps.version.outputs.action_release_type }}
          version: ${{ steps.version.outputs.normalized }}
          commit: false

      - name: Write release notes from AI action output
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.unreleased-content }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > RELEASE_NOTES.md

      - name: Commit changelog changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "docs: update CHANGELOG.md for ${{ steps.version.outputs.tag }}"
            git push origin HEAD
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          git fetch --tags
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists"
            exit 1
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Update major and minor action tags
        if: ${{ steps.version.outputs.is_prerelease == 'false' }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.normalized }}'
          release_tag='${{ steps.version.outputs.tag }}'

          IFS='.' read -r major minor patch <<< "$version"
          major_tag="v${major}"
          minor_tag="v${major}.${minor}"

          git tag -fa "$major_tag" -m "Update ${major_tag} to ${release_tag}"
          git tag -fa "$minor_tag" -m "Update ${minor_tag} to ${release_tag}"

          git push origin "refs/tags/${major_tag}" --force
          git push origin "refs/tags/${minor_tag}" --force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --notes-file RELEASE_NOTES.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
