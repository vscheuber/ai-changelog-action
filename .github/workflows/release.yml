name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | patch | minor | major'
        default: 'prerelease'
        required: true
      current-version:
        description: 'Optional current/base version override (example: 1.2.0, 1.2.0-rc.2, or v1.2.0)'
        default: ''
        required: false
      prerelease-identifier:
        description: 'Identifier used for prereleases (example: beta, rc, alpha)'
        default: 'rc'
        required: true
      llm-provider:
        description: 'LLM provider'
        default: 'openai'
        required: true
      model:
        description: 'LLM model'
        default: 'gpt-4o'
        required: true
      target-user-type:
        description: 'Audience type for changelog output (user or developer)'
        default: 'user'
        required: true
      user-focus:
        description: 'Optional audience override phrase (example: CLI users)'
        default: ''
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          release_type='${{ inputs.release-type }}'
          prerelease_id='${{ inputs.prerelease-identifier }}'
          current_input='${{ inputs.current-version }}'
          semver_re='^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$'

          case "$release_type" in
            prerelease|patch|minor|major) ;;
            *)
              echo "release-type must be one of: prerelease, patch, minor, major"
              exit 1
              ;;
          esac

          base_source=''

          if [[ -n "$current_input" ]]; then
            if [[ "$current_input" =~ ^v?([0-9]+)$ ]]; then
              base_tag="${BASH_REMATCH[1]}.0.0"
              base_source="input-major-alias"
            else
              base_tag="$current_input"
              base_source="input"
            fi
          else
            all_tags="$(git tag --sort=-v:refname)"
            latest_semver=''
            latest_major_alias=''

            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              stripped="${tag#v}"
              if [[ -z "$latest_semver" && "$stripped" =~ $semver_re ]]; then
                latest_semver="$tag"
              fi
              if [[ -z "$latest_major_alias" && "$tag" =~ ^v([0-9]+)$ ]]; then
                latest_major_alias="$tag"
              fi
              if [[ -n "$latest_semver" && -n "$latest_major_alias" ]]; then
                break
              fi
            done <<< "$all_tags"

            if [[ -n "$latest_semver" ]]; then
              base_tag="$latest_semver"
              base_source="latest-semver-tag"
            elif [[ -n "$latest_major_alias" ]]; then
              base_tag="${latest_major_alias#v}.0.0"
              base_source="major-alias-bootstrap"
            elif [[ -n "$all_tags" ]]; then
              echo "No semver-compatible tags found. Provide current-version explicitly (for example 1.0.0)."
              exit 1
            else
              base_tag='0.0.0'
              base_source="no-tags-bootstrap"
            fi
          fi

          base="${base_tag#v}"
          if [[ ! "$base" =~ $semver_re ]]; then
            echo "Could not parse semver from '$base_tag'"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          pre="${BASH_REMATCH[5]:-}"

          stable_major="$major"
          stable_minor="$minor"
          stable_patch="$patch"

          if [[ "$release_type" == "prerelease" ]]; then
            if [[ -n "$pre" ]]; then
              if [[ "$pre" =~ ^([A-Za-z0-9-]+)\.([0-9]+)$ ]]; then
                label="${BASH_REMATCH[1]}"
                num="${BASH_REMATCH[2]}"
                next="${major}.${minor}.${patch}-${label}.$((num + 1))"
              else
                next="${major}.${minor}.${patch}-${prerelease_id}.1"
              fi
            else
              next="${major}.${minor}.$((patch + 1))-${prerelease_id}.1"
            fi
            is_prerelease='true'
            action_release_type='prerelease'
          elif [[ "$release_type" == "patch" ]]; then
            if [[ -n "$pre" ]]; then
              next="${stable_major}.${stable_minor}.${stable_patch}"
            else
              next="${major}.${minor}.$((patch + 1))"
            fi
            is_prerelease='false'
            action_release_type='full'
          elif [[ "$release_type" == "minor" ]]; then
            next="${stable_major}.$((stable_minor + 1)).0"
            is_prerelease='false'
            action_release_type='full'
          else
            next="$((stable_major + 1)).0.0"
            is_prerelease='false'
            action_release_type='full'
          fi

          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "base_source=${base_source}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "action_release_type=${action_release_type}" >> "$GITHUB_OUTPUT"
          echo "normalized=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      - name: Show release plan
        run: |
          echo "Base version: ${{ steps.version.outputs.base }}"
          echo "Base source: ${{ steps.version.outputs.base_source }}"
          echo "Release type: ${{ steps.version.outputs.release_type }}"
          echo "Action release-type: ${{ steps.version.outputs.action_release_type }}"
          echo "Next version: ${{ steps.version.outputs.normalized }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"

      - name: Update changelog using this action
        id: changelog
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-provider: ${{ inputs.llm-provider }}
          model: ${{ inputs.model }}
          target-user-type: ${{ inputs.target-user-type }}
          user-focus: ${{ inputs.user-focus }}
          release-type: ${{ steps.version.outputs.action_release_type }}
          version: ${{ steps.version.outputs.normalized }}
          commit: false

      - name: Promote Unreleased section and extract release notes
        id: promote
        env:
          CHANGELOG_PATH: CHANGELOG.md
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.CHANGELOG_PATH || 'CHANGELOG.md';
          const tag = process.env.RELEASE_TAG;
          const date = new Date().toISOString().slice(0, 10);

          if (!fs.existsSync(path)) {
            throw new Error(`${path} does not exist`);
          }

          const content = fs.readFileSync(path, 'utf8');
          const match = content.match(/^##?\s+Unreleased\s*\n([\s\S]*?)(?=^##?\s+|(?![\s\S]))/im);
          if (!match) {
            throw new Error('Could not find an Unreleased section in CHANGELOG.md');
          }

          const unreleasedBody = match[1].trim();
          const normalizedBody = unreleasedBody.replace(/\r\n/g, '\n').trim();
          if (!normalizedBody || normalizedBody === '- No user-facing changes.') {
            throw new Error('No changelog changes detected under Unreleased; aborting release.');
          }

          const releaseBody = unreleasedBody || '- No user-facing changes.';
          const releaseHeading = `## [${tag}] - ${date}`;

          if (content.includes(releaseHeading)) {
            throw new Error(`Release heading already exists: ${releaseHeading}`);
          }

          const replacement = `## Unreleased\n\n${releaseHeading}\n\n${releaseBody}\n\n`;
          const updated = content.replace(match[0], replacement).replace(/\n{3,}/g, '\n\n');

          fs.writeFileSync(path, updated, 'utf8');
          fs.writeFileSync('RELEASE_NOTES.md', releaseBody + '\n', 'utf8');
          NODE

      - name: Commit changelog changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "docs: update CHANGELOG.md for ${{ steps.version.outputs.tag }}"
            git push origin HEAD
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          git fetch --tags
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists"
            exit 1
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Update major and minor action tags
        if: ${{ steps.version.outputs.is_prerelease == 'false' }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.normalized }}'
          release_tag='${{ steps.version.outputs.tag }}'

          IFS='.' read -r major minor patch <<< "$version"
          major_tag="v${major}"
          minor_tag="v${major}.${minor}"

          git tag -fa "$major_tag" -m "Update ${major_tag} to ${release_tag}"
          git tag -fa "$minor_tag" -m "Update ${minor_tag} to ${release_tag}"

          git push origin "refs/tags/${major_tag}" --force
          git push origin "refs/tags/${minor_tag}" --force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.is_prerelease }}
